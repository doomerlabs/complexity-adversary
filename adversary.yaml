name: review/complexity
version: 0.0.17
description: Reviews code changes for implementation complexity that appears disproportionate to the behavior being added.

triggers:
  manual: true
  files_changed:
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.py"
    - "**/*.rs"

detection:
  files:
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.mts"
    - "**/*.cts"
    - "**/*.py"
    - "**/*.rs"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
